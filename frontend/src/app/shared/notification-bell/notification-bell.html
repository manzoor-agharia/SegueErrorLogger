<button class="btn-icon bell-btn" (click)="toggle()" aria-label="Notifications" title="Notifications">
  <i class="material-icons">notifications</i>
  @if (unreadCount() > 0) {
    <span class="badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
  }
</button>

@if (open()) {
  <div class="dropdown">
    <div class="dropdown-header">
      <span>Notifications</span>
      @if (unreadCount() > 0) {
        <button class="link-btn" (click)="markAllRead()">Mark all read</button>
      }
    </div>

    @if (notifications().length === 0) {
      <p class="empty">No notifications yet.</p>
    } @else {
      <ul class="notification-list">
        @for (notification of notifications(); track notification.id) {
          <li
            class="notification-item"
            [class.unread]="!notification.is_read"
            (click)="openNotification(notification)"
          >
            <span class="dot" [class.dot--visible]="!notification.is_read"></span>
            <div class="notification-body">
              <span class="message">{{ notification.message }}</span>
              <span class="time">{{ notification.created_at | date: 'short' }}</span>
            </div>
          </li>
        }
      </ul>
    }
  </div>
}
