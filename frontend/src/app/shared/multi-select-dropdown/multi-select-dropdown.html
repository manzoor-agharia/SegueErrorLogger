<button type="button" class="ms-trigger" (click)="toggle()">
  <span class="ms-summary" [class.ms-summary--placeholder]="selected.length === 0">{{ summary }}</span>
  <i class="material-icons">arrow_drop_down</i>
</button>

@if (open()) {
  <div class="ms-panel">
    <div class="ms-panel-header">
      <span>{{ selected.length }} selected</span>
      @if (selected.length > 0) {
        <button type="button" class="ms-clear" (click)="clear()">Clear</button>
      }
    </div>
    <ul class="ms-options">
      @for (option of options; track option.value) {
        <li>
          <label class="ms-option">
            <input type="checkbox" [checked]="isChecked(option.value)" (change)="toggleOption(option.value, $event)" />
            <span>{{ option.label }}</span>
          </label>
        </li>
      }
    </ul>
  </div>
}
