<div class="auth-page">
  <div class="auth-card card">
    <h1 class="text-page-title">ErrorLogger</h1>
    <p class="subtitle text-body-sm">Sign in to continue</p>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </div>

      @if (error()) {
        <p class="form-error-msg">{{ error() }}</p>
      }

      <button class="btn btn-primary full-width" type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          Log in
        }
      </button>
    </form>

    <p class="switch text-body-sm">Don't have an account? <a routerLink="/register">Create one</a></p>

    @if (showUiSwitcher) {
      <div class="ui-switcher">
        <span class="ui-switcher-label">Open with</span>
        <div class="ui-switcher-options">
          @for (flavor of uiFlavors; track flavor) {
            <label class="ui-switcher-option" [class.ui-switcher-option--active]="selectedUi === flavor">
              <input type="radio" name="ui-flavor" [value]="flavor" [(ngModel)]="selectedUi" />
              <span>{{ uiLabels[flavor] }}</span>
            </label>
          }
        </div>
        <p class="ui-switcher-hint">Dev only — requires all three served from one origin via dev-proxy.</p>
      </div>
    }
  </div>
</div>
