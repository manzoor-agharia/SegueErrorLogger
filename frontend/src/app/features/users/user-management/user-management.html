<div class="page-header">
  <h1 class="text-page-title">User Management</h1>
  <button class="btn btn-primary" (click)="openCreate()">
    <i class="material-icons">person_add</i>
    Create User
  </button>
</div>

<table class="data-table users-table">
  <thead class="data-table__header">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Status</th>
      <th>Joined</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (user of users(); track user.id) {
      <tr class="data-table__row">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <span class="status-pill" [class.status-pill--active]="user.is_active" [class.status-pill--inactive]="!user.is_active">
            {{ user.is_active ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td>{{ user.created_at | date: 'mediumDate' }}</td>
        <td>
          <button class="btn-icon" (click)="openEdit(user)" title="Edit">
            <i class="material-icons">edit</i>
          </button>
          <button class="btn-icon" (click)="deleteUser(user)" title="Delete">
            <i class="material-icons">delete</i>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>

@if (formOpen()) {
  <div class="modal-backdrop" (click)="onFormCancelled()">
    <div class="modal-panel" (click)="$event.stopPropagation()">
      <app-user-form [user]="formEditUser()" (saved)="onFormSaved($event)" (cancelled)="onFormCancelled()" />
    </div>
  </div>
}
