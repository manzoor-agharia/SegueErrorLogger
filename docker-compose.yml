services:
  app:
    build: .
    container_name: errorlogger-app
    ports:
      - "8090:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Your_password123@host.docker.internal:5434/ErrorLogger
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "480"
      ATTACHMENTS_DIR: /app/attachments
      CORS_ORIGINS: http://localhost:8090
    volumes:
      - errorlogger_attachments:/app/attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  errorlogger_attachments:
